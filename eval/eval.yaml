    expected_answer: "SUP014 GymCare Technical Services has the highest score at 44.3. Four suppliers are in the High band (score >= 40): SUP014 (44.3), SUP013 FitTech Service & Repair (42.6), SUP001 SparkleClean Commercial (41.8), SUP030 Vigilant Alarm Monitoring (41.6)"
