    golden_sql: "WITH perf AS (SELECT supplier_id, AVG(overall_score) a FROM {{DB}}.PUBLIC.SUPPLIER_ASSESSMENTS WHERE assessment_period IN ('H1-FY2026','H2-FY2026') GROUP BY 1), inv AS (SELECT supplier_id, SUM(invoice_amount) invd, SUM(IFF(payment_status='Overdue',invoice_amount,0)) od FROM {{DB}}.PUBLIC.PO_INVOICES WHERE invoice_date > DATEADD(month,-12,'2026-10-31'::DATE) AND invoice_date <= '2026-10-31'::DATE GROUP BY 1), inc AS (SELECT po.supplier_id, COUNT(*) n FROM {{DB}}.PUBLIC.INCIDENT_LOG i JOIN {{DB}}.PUBLIC.PO_TRANSACTIONS po ON po.po_id=i.related_po_id WHERE i.severity IN ('High','Critical') AND i.incident_date > DATEADD(month,-12,'2026-10-31'::DATE) AND i.incident_date <= '2026-10-31'::DATE GROUP BY 1) SELECT s.supplier_id, ROUND(100*(0.4*(5-COALESCE(p.a,3))/4 + 0.3*COALESCE(inv.od/NULLIF(inv.invd,0),0) + 0.3*LEAST(COALESCE(inc.n,0)/5,1)),1) risk FROM {{DB}}.PUBLIC.SUPPLIERS s LEFT JOIN perf p USING (supplier_id) LEFT JOIN inv USING (supplier_id) LEFT JOIN inc USING (supplier_id) ORDER BY risk DESC"
    notes: "Mirrors load_supplier_scorecard() + risk_score() in streamlit_app.py. Computed 2026-10-05"
    user_grade: confirmed
    annotations: { origin: generated, reviewed: true, answer_verified: true }

