  - id: q8
    tier: answer
    question: "In FY2026, how many suppliers fell into tail spend, and what share of approved spend did they account for?"
    expected_answer: "28 tail suppliers (22 core), accounting for $34,605,822.21, or 18.35% of FY2026 approved spend"
    source: auto_from_definition
    derived_from: "glossary.md tail spend (80% cumulative threshold, crossing supplier is core)"
    golden_sql: "WITH sp AS (SELECT supplier_id, SUM(amount) s FROM {{DB}}.PUBLIC.PO_TRANSACTIONS WHERE status='Approved' AND financial_year='FY2026' GROUP BY 1), c AS (SELECT supplier_id, s, SUM(s) OVER (ORDER BY s DESC, supplier_id ROWS UNBOUNDED PRECEDING) cum, SUM(s) OVER () tot FROM sp), k AS (SELECT *, COALESCE(LAG(cum) OVER (ORDER BY s DESC, supplier_id),0) prev FROM c) SELECT IFF(prev<0.8*tot,'core','tail') seg, COUNT(*), ROUND(SUM(s),2), ROUND(100*SUM(s)/MAX(tot),2) FROM k GROUP BY 1"
    notes: "Computed 2026-10-05"
    user_grade: confirmed
    annotations: { origin: generated, reviewed: true, answer_verified: true }

